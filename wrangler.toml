name = "walkthrough"
main = "src/index.js"
compatibility_date = "2024-09-23"

account_id = "fff33666fc1a1814c66b860ee62f7790"

# Route lives under [env.production], not at the top level — prevents it being
# inherited by [env.beta]. Deploy with: wrangler deploy --env production | --env beta

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "WALKTHROUGHS"
bucket_name = "parkins-ai-walkthroughs"

# ── Production ─────────────────────────────────────────────────────────────
[env.production]
name = "walkthrough"
routes = [
  { pattern = "walkthrough.parkins.ai", custom_domain = true }
]

[env.production.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.production.r2_buckets]]
binding = "WALKTHROUGHS"
bucket_name = "parkins-ai-walkthroughs"

# ── Beta (beta.walkthrough.parkins.ai, S-ARCH-11; workers.dev kept) ─────────
# Beta storage: the production bucket below, as a recorded S-ARCH-18 exception
# to S-ARCH-12 (14 Nov 2026; ROADMAP.md, "Exceptions"). This Worker only reads
# WALKTHROUGHS (get/head/list in src/index.js, no put/delete); walkthroughs are
# written from the Mac by bin/walkthrough.py, never through a Worker. Beta
# therefore cannot change production data.
[env.beta]
name = "walkthrough-beta"
workers_dev = true
routes = [
  { pattern = "beta.walkthrough.parkins.ai", custom_domain = true }
]

[env.beta.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[env.beta.r2_buckets]]
binding = "WALKTHROUGHS"
bucket_name = "parkins-ai-walkthroughs"
